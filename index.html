<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#EDF0F2">
<title>DiGe Budget</title>
<style>
/* ---------- tokens: same slate palette, radii and spacing scale as DiGe FN ---------- */
:root{
 --bg:#EDF0F2;--card:#F8F9FA;--ink:#303D48;--line:#D5DCE1;--acc:#718A9B;--mut:#5C6974;--acc2:#A9BAC5;--hl:#E1E8EC;
 --ok:#8EAA9C;--warnacc:#C5B49B;--acc-ink:#56707F;--acc-fill:#56707F;--ok-ink:#4D7060;--okbg:#E3ECE7;
 --warn:#6E5A3A;--warnbg:#F2EDE4;--err:#A8392F;--errbg:#F5E4E1;--sel:#E1E8EC;--row-alt:#F2F4F6;
 --shadow:rgba(48,61,72,.14);--shadow-sm:rgba(48,61,72,.06);--overlay:rgba(34,43,51,.5);
 --sp-1:8px;--sp-2:12px;--sp-3:16px;--sp-4:24px;
 --r-1:6px;--r-2:8px;--r-3:12px;--r-pill:999px;
 --fs-1:12px;--fs-2:13px;--fs-3:14px;--fs-4:16px;
 --sh-1:0 1px 2px var(--shadow-sm);--sh-2:0 10px 30px var(--shadow);
 --tap:44px;--maxw:760px;--focus:2px solid var(--acc-ink);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
 --bg:#222B33;--card:#2C3740;--ink:#E0E7EB;--line:#3D4A54;--acc:#8DA6B7;--mut:#AEBCC6;--acc2:#718A9B;--hl:#35434D;
 --ok:#8EAA9C;--warnacc:#C5B49B;--acc-ink:#8DA6B7;--acc-fill:#8DA6B7;--ok-ink:#8EAA9C;--okbg:#2F3F3A;
 --warn:#C5B49B;--warnbg:#3A3832;--err:#E3928A;--errbg:#43302F;--sel:#35434D;--row-alt:#303C46;
 --shadow:rgba(12,16,20,.45);--shadow-sm:rgba(12,16,20,.25);--overlay:rgba(16,21,26,.62)}}
:root[data-theme=dark]{
 --bg:#222B33;--card:#2C3740;--ink:#E0E7EB;--line:#3D4A54;--acc:#8DA6B7;--mut:#AEBCC6;--acc2:#718A9B;--hl:#35434D;
 --ok:#8EAA9C;--warnacc:#C5B49B;--acc-ink:#8DA6B7;--acc-fill:#8DA6B7;--ok-ink:#8EAA9C;--okbg:#2F3F3A;
 --warn:#C5B49B;--warnbg:#3A3832;--err:#E3928A;--errbg:#43302F;--sel:#35434D;--row-alt:#303C46;
 --shadow:rgba(12,16,20,.45);--shadow-sm:rgba(12,16,20,.25);--overlay:rgba(16,21,26,.62)}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 var(--fs-3)/1.45 system-ui,sans-serif;-webkit-text-size-adjust:100%}
.num{font-variant-numeric:tabular-nums}
.neg{color:var(--err)}
html[data-theme=dark] .neg,html[data-look=glass]:not([data-wall=lightgray]):not([data-tone=light]) .neg{color:#FF8F85;text-shadow:0 0 1px rgba(0,0,0,.35)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:var(--focus);outline-offset:2px}
[hidden]{display:none!important}
svg.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- shell: top bar / one scroll area / bottom bar (rail on wide screens) ---------- */
#app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:100dvh;min-width:0}
#top{display:flex;align-items:center;gap:var(--sp-2);padding:6px var(--sp-3);padding-top:calc(6px + env(safe-area-inset-top,0px));background:var(--card);border-bottom:1px solid var(--line);min-height:56px;z-index:3}
#top .applogo{display:none;width:40px;height:40px;border-radius:11px;box-shadow:0 1px 3px var(--shadow)}
#top.ishome #menu{width:48px;padding:0}
#top.ishome #menu .ic{display:none}
#top.ishome #menu .applogo{display:block}
#top h1{flex:1;min-width:0;margin:0;font-size:var(--fs-4);font-weight:700;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#main{overflow-y:auto;overscroll-behavior:contain;scroll-padding-top:var(--sp-3);min-width:0}
.wrap{max-width:var(--maxw);margin:0 auto;padding:var(--sp-3);display:grid;grid-template-columns:minmax(0,1fr);gap:var(--sp-3);min-width:0}
@media (min-width:1024px){.wrap{padding:var(--sp-4)}}
#drawer{margin:0;padding:0;width:min(300px,86vw);height:100dvh;max-height:100dvh;inset:0 auto 0 0;border-width:0 1px 0 0;border-radius:0 var(--r-3) var(--r-3) 0;overflow-y:auto}
#drawer[open]{display:flex;flex-direction:column;animation:dslide .18s ease-out}
@keyframes dslide{from{transform:translateX(-24px);opacity:0}to{transform:none;opacity:1}}
#drawer .dh{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);padding:var(--sp-2) var(--sp-3);padding-top:calc(var(--sp-2) + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line);font-size:var(--fs-4)}
#drawer nav{padding:var(--sp-1) var(--sp-2) calc(var(--sp-3) + env(safe-area-inset-bottom,0px));display:grid;gap:2px}
#drawer .dg{padding:var(--sp-3) var(--sp-2) 4px;font-size:var(--fs-1);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.dnav{display:flex;align-items:center;gap:var(--sp-2);width:100%;min-height:48px;padding:0 var(--sp-2);border:0;border-radius:var(--r-2);background:none;color:var(--ink);font-weight:600;text-align:left;position:relative}
.dnav:hover{background:var(--hl)}
.dnav[aria-current=page]{background:var(--sel);color:var(--acc-ink);font-weight:700}
.dnav[aria-current=page]::before{content:"";position:absolute;left:-8px;top:25%;bottom:25%;width:3px;border-radius:0 3px 3px 0;background:var(--acc)}
.btn:disabled{opacity:.4;cursor:default}
.field{min-width:0}
input{min-width:0}

/* ---------- components ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-3);padding:var(--sp-3);min-width:0}
.sh{display:flex;align-items:center;gap:var(--sp-1);margin:0 0 var(--sp-2);font-size:var(--fs-2);font-weight:600;letter-spacing:.02em;color:var(--mut);min-height:var(--sp-4)}
.sh .sp{margin-left:auto}
.sh .btn{min-height:36px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:none;min-height:var(--tap);padding:0 var(--sp-3);border:1px solid var(--line);border-radius:var(--r-2);background:var(--card);color:var(--ink);font-weight:600;font-size:var(--fs-3);white-space:nowrap}
.btn:hover{background:var(--hl)}
.btn.pri{background:var(--acc-fill);border-color:var(--acc-fill);color:var(--card)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none;color:var(--acc-ink)}
.btn.ghost:hover{background:var(--hl)}
.btn.danger{color:var(--err);border-color:var(--err);background:none}
.btn.icon{width:var(--tap);padding:0}
.btn.wide{width:100%;white-space:normal;text-align:center}
.chip{display:inline-flex;align-items:center;gap:6px;flex:none;min-height:36px;padding:0 var(--sp-2);border:1px solid var(--line);border-radius:var(--r-pill);background:var(--bg);color:var(--ink);font-size:var(--fs-2);font-weight:500;white-space:nowrap;position:relative}
.chip[aria-pressed=true],.chip.on{background:var(--sel);border-color:var(--acc-ink);font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.chip.nsc{max-width:70vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
label.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
label.chip:has(input:checked){background:var(--sel);border-color:var(--acc-ink);font-weight:700}
label.chip:has(input:focus-visible){outline:var(--focus);outline-offset:2px}
.big{font-size:clamp(28px,1.2rem + 3vw,40px);font-weight:700;line-height:1.1;letter-spacing:-.01em;overflow-wrap:anywhere}
.split{display:flex;flex-wrap:wrap;gap:var(--sp-1) var(--sp-4);margin-top:var(--sp-2);color:var(--mut)}
.split b{color:var(--ink);font-weight:700}
.inc{color:var(--ok-ink)}
.muted{color:var(--mut)}
.small{font-size:var(--fs-2)}
.row{display:flex;align-items:center;gap:var(--sp-2);width:100%;min-height:52px;padding:var(--sp-1) 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;min-width:0}
.row:first-child{border-top:0}
button.row:hover{background:var(--hl)}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{color:var(--mut);font-size:var(--fs-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .amt{flex:none;font-weight:700;text-align:right}
.dot{flex:none;width:12px;height:12px;border-radius:50%;background:var(--acc)}
.day{display:flex;justify-content:space-between;gap:var(--sp-2);padding:var(--sp-2) 0 4px;color:var(--mut);font-size:var(--fs-2);font-weight:600;letter-spacing:.02em}
details.acc{border:1px solid var(--line);border-radius:var(--r-3);background:var(--card)}
details.acc>summary{display:flex;align-items:center;gap:var(--sp-2);min-height:var(--tap);padding:0 var(--sp-3);cursor:pointer;list-style:none;font-weight:600}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::before{content:"";flex:none;width:7px;height:7px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(-45deg);transition:transform .15s}
details.acc[open]>summary::before{transform:rotate(45deg)}
details.acc>summary .sum{margin-left:auto;font-weight:400;color:var(--mut);min-width:0;text-align:right;overflow-wrap:anywhere}
details.acc>.accb{padding:0 var(--sp-3) var(--sp-3)}
.bar{height:8px;border-radius:var(--r-pill);background:var(--hl);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:var(--r-pill);background:var(--acc)}
.bar.warn>i{background:var(--warnacc)}
.bar.over>i{background:var(--err)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:var(--r-pill);font-size:var(--fs-1);font-weight:600;background:var(--hl);color:var(--mut)}
.pill.ok{background:var(--okbg);color:var(--ok-ink)}
.pill.warn{background:var(--warnbg);color:var(--warn)}
.pill.err{background:var(--errbg);color:var(--err)}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2)}
.mnav .lbl{font-weight:700;font-size:var(--fs-4);text-align:center;flex:1}
.empty{text-align:center;color:var(--mut);padding:var(--sp-4) var(--sp-2)}
.empty .btn{margin-top:var(--sp-2)}
.sw{display:flex;align-items:center;gap:var(--sp-2);width:100%;min-height:var(--tap);border:0;background:none;text-align:left;padding:0}
.sw::after{content:"";flex:none;margin-left:auto;width:42px;height:24px;border-radius:var(--r-pill);background:var(--line) radial-gradient(circle at 12px 12px,var(--card) 9px,transparent 10px);box-shadow:inset 0 0 0 1px var(--acc2)}
.sw[aria-checked=true]::after{background:var(--acc-fill) radial-gradient(circle at 30px 12px,var(--card) 9px,transparent 10px)}
.bkrow{display:grid;gap:var(--sp-1)}
.hint{font-size:var(--fs-2);color:var(--mut)}
svg.chart{display:block;width:100%;max-width:520px;height:auto;margin:0 auto}
table.mini{width:100%;border-collapse:collapse;font-size:var(--fs-2)}
table.mini th,table.mini td{padding:6px 4px;text-align:right;border-top:1px solid var(--line)}
table.mini th:first-child,table.mini td:first-child{text-align:left}
.legend{display:flex;gap:var(--sp-3);flex-wrap:wrap;font-size:var(--fs-2);color:var(--mut);margin-bottom:var(--sp-1)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* ---------- account tiles, donut, more grid ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--sp-2)}
.tile{--c:var(--acc);display:grid;align-content:start;gap:4px;min-height:96px;padding:var(--sp-2);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:var(--r-3);background:var(--card);background:color-mix(in srgb,var(--c) 20%,var(--card));text-align:left;min-width:0}
.tile:hover{filter:brightness(.97)}
.tile .tt{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:var(--fs-1);font-weight:600;letter-spacing:.02em}
.tile .tt .ic{width:16px;height:16px}
.tile .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .bl{font-size:var(--fs-4);font-weight:700;overflow-wrap:anywhere}
.tile .sb{font-size:var(--fs-1);color:var(--mut)}
.tile.add{--c:var(--line);background:none;border-style:dashed;border-left-width:1px;align-content:center;justify-items:center;color:var(--acc-ink);font-weight:600}
.donutbox{display:flex;gap:var(--sp-3);align-items:center;flex-wrap:wrap;justify-content:center}
.donutbox svg{flex:none;width:170px;height:170px}
.donutbox .lg{flex:1 1 220px;min-width:0}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-2)}
@media (min-width:600px){.mgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mtile{display:grid;justify-items:center;align-content:center;gap:var(--sp-1);min-height:112px;padding:var(--sp-3) var(--sp-2);border:1px solid var(--line);border-radius:var(--r-3);background:var(--card);font-weight:600;text-align:center}
.mtile:hover{background:var(--hl)}
.mtile .ci{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:var(--hl);color:var(--acc-ink)}
.mtile .ci .ic{width:24px;height:24px}
.mtile small{font-weight:400;color:var(--mut);font-size:var(--fs-1)}
.bbar{display:grid;gap:4px;padding:6px 0}
.bbar .hd{display:flex;gap:var(--sp-1);align-items:baseline;min-width:0}
.bbar .hd .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}

.badge{flex:none;display:inline-grid;place-items:center;border-radius:6px;font-weight:800;letter-spacing:-.02em;line-height:1;object-fit:contain;overflow:hidden;white-space:nowrap;text-align:center;font-family:system-ui,sans-serif}
.badge.gen{background:var(--hl);color:var(--acc-ink)}
.badge.gen .ic{width:60%;height:60%}
img.badge{background:#fff}
.qp{display:flex;gap:var(--sp-1);overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.qpb{flex:none;display:flex;align-items:center;gap:6px;min-height:var(--tap);padding:0 10px 0 8px;border:1px solid var(--line);border-radius:var(--r-2);background:var(--bg);font-weight:600;font-size:var(--fs-2);white-space:nowrap}
.qpb:hover{background:var(--hl)}
.prevrow{display:flex;gap:var(--sp-2);align-items:center}
.daterow{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-2)}
input[type=color]{width:44px;height:44px;padding:2px;border:1px solid var(--line);border-radius:var(--r-2);background:var(--bg);flex:none}
.colrow{display:flex;align-items:center;gap:var(--sp-2)}
.cw{display:grid;gap:12px;justify-items:center;margin-top:6px;padding:12px;border:1px solid var(--line);border-radius:var(--r-3);background:var(--card)}
.cw canvas{width:min(100%,240px);aspect-ratio:1;border-radius:50%;touch-action:none;cursor:crosshair;box-shadow:0 0 0 1px var(--line)}
.cw .cwb{width:100%;display:grid;gap:4px}
.cw input[type=range]{width:100%;height:28px;margin:0;-webkit-appearance:none;appearance:none;border-radius:14px;background:linear-gradient(90deg,#000,var(--cwc,#fff));border:1px solid var(--line)}
.cw input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:3px solid #333;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.cw input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid #333}
.cw .cwr{display:flex;align-items:center;gap:12px;width:100%}
.cw .cwp{width:44px;height:44px;border-radius:12px;flex:none;box-shadow:inset 0 0 0 1px var(--line)}
.cw .cwr input[type=text]{flex:1;min-width:0;text-transform:uppercase;font-variant-numeric:tabular-nums}

/* ---------- forms + dialogs ---------- */
.field{display:grid;gap:4px}
.field>span{font-size:var(--fs-2);font-weight:600;color:var(--mut)}
input[type=text],input[type=search],input[type=date],input[type=number],input[inputmode],select{width:100%;min-height:var(--tap);padding:0 var(--sp-2);border:1px solid var(--line);border-radius:var(--r-2);background:var(--bg);color:var(--ink);font-size:var(--fs-4)}
input.amount{font-size:28px;font-weight:700;min-height:56px;font-variant-numeric:tabular-nums}
.dform{display:grid;gap:var(--sp-3)}
.dform h2{margin:0;font-size:var(--fs-4)}
.actions{display:flex;gap:var(--sp-1);flex-wrap:wrap}
.actions .grow{flex:1}
.err{color:var(--err);font-weight:600;min-height:1.2em;font-size:var(--fs-2)}
.swatches{display:flex;gap:2px;flex-wrap:wrap}
.swatches label{position:relative;width:var(--tap);height:var(--tap);display:grid;place-items:center}
.swatches input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.swatches span{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--line)}
.swatches input:checked+span{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--acc-ink)}
.swatches input:focus-visible+span{outline:var(--focus);outline-offset:3px}
.chk{display:flex;align-items:center;gap:var(--sp-2);min-height:var(--tap)}
.chk input{width:22px;height:22px;flex:none;accent-color:var(--acc-fill)}
dialog{border:1px solid var(--line);border-radius:var(--r-3);background:var(--card);color:var(--ink);box-shadow:var(--sh-2);padding:var(--sp-3);width:min(460px,calc(100vw - 32px));max-height:min(88dvh,720px);overflow:auto}
dialog::backdrop{background:var(--overlay)}
@media (max-width:599px){
 dialog.sheet{margin:auto 0 0;width:100vw;max-width:100vw;border-radius:var(--r-3) var(--r-3) 0 0;border-bottom:0;padding-bottom:calc(var(--sp-3) + env(safe-area-inset-bottom,0px))}
}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;align-items:center;gap:var(--sp-2);max-width:calc(100vw - 32px);padding:6px 6px 6px var(--sp-3);border-radius:var(--r-2);background:var(--ink);color:var(--bg);box-shadow:var(--sh-2);font-weight:600}
#toast .btn{min-height:36px;background:none;border-color:transparent;color:var(--bg);text-decoration:underline}
@media (min-width:1024px){#toast{bottom:var(--sp-4)}}
#banner{display:flex;gap:var(--sp-2);align-items:center;padding:var(--sp-2) var(--sp-3);background:var(--warnbg);color:var(--warn);border-bottom:1px solid var(--warnacc);font-weight:600}


details.xt{border:1px dashed var(--line);border-radius:var(--r-3);padding:0 var(--sp-2)}
details.xt>summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:600;color:var(--mut)}
details.xt[open]{padding-bottom:var(--sp-2)}
#lock{position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:var(--bg);overflow:auto;padding:16px}
#lock[hidden]{display:none}
html[data-look=glass] #lock{background:#1b2027}
#lock .lk{display:grid;gap:12px;justify-items:center;width:min(320px,100%)}
#lock .lg2{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:var(--ink);color:var(--bg);font:700 24px Georgia,serif}
#lock .dots{display:flex;gap:12px;min-height:16px}
#lock .dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--mut)}
#lock .dots i.on{background:var(--ink);border-color:var(--ink)}
#lock .pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px;justify-content:center}
#lock .pad button{height:64px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 22px system-ui}
#lock .pad button:active{background:var(--sel)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:12px;text-align:center}
.cal .cd{position:relative;display:grid;place-items:center;min-height:40px;border-radius:10px;font-size:var(--fs-2)}
.cal .cd.h{min-height:24px;color:var(--mut);font-weight:700;font-size:11px}
.cal .cd.now{box-shadow:inset 0 0 0 1.5px var(--acc)}

/* ---------- calculations ---------- */
function accById(id){return S.accounts.filter(function(a){return a.id===id})[0]}
function catById(id){return S.cats.filter(function(c){return c.id===id})[0]}
function bal(id){
 var a=accById(id),b=a?a.start:0;
 S.tx.forEach(function(t){
  if(t.type==='inc'&&t.acc===id)b+=t.amt;
  else if(t.type==='exp'&&t.acc===id)b-=t.amt;
  else if(t.type==='tr'){if(t.acc===id)b-=t.amt;if(t.to===id)b+=t.amt}
 });return b;
}
function included(id){var a=accById(id);return !!a&&!a.skip}
function totalBal(){return S.accounts.reduce(function(s,a){return a.skip?s:s+bal(a.id)},0)}
function eff(t){ /* effect of one transaction on the total balance */
 if(t.type==='inc')return included(t.acc)?t.amt:0;
 if(t.type==='exp')return included(t.acc)?-t.amt:0;
 return (included(t.to)?t.amt:0)-(included(t.acc)?t.amt:0);
}
function txIn(from,to){return S.tx.filter(function(t){return t.date>=from&&t.date<=to})}
function txEx(from,to){return txIn(from,to).filter(function(t){return !t.ln})}
function monthTx(k){return txEx(k+'-01',k+'-31')}
function sumsR(from,to){var r={inc:0,exp:0};txEx(from,to).forEach(function(t){if(t.type==='inc')r.inc+=t.amt;else if(t.type==='exp')r.exp+=t.amt});return r}
function sums(k){return sumsR(k+'-01',k+'-31')}
function catSpendR(from,to){var m={};txEx(from,to).forEach(function(t){if(t.type==='exp'){var c=t.cat||'_none';m[c]=(m[c]||0)+t.amt}});return m}
function catSpend(k){return catSpendR(k+'-01',k+'-31')}
function sortTx(a){return a.slice().sort(function(x,y){return x.date<y.date?1:x.date>y.date?-1:(y.ts||0)-(x.ts||0)})}

 var p=c.parent?catById(c.parent):null;if(p&&catCust(p))return p.color;return ICO_COL[catIconName(id)]||c.color}

function spendBlock(sp,label,txs){

 Object.keys(sp).forEach(function(id){var v=sp[id];tot+=v;var top=id==='_none'?'_none':catTop(id);tops[top]=(tops[top]||0)+v;

 var ids=Object.keys(tops).sort(function(a,b){return tops[b]-tops[a]});
 if(!ids.length)return empty('No expenses in this period.');
 var items=[],rest=0;
 ids.forEach(function(id,i){if(i<6)items.push({id:id,v:tops[id],c:catColor(id==='_none'?'':id),n:id==='_none'?'Uncategorized':catName(id)});else rest+=tops[id]});
 if(rest)items.push({id:'_rest',v:rest,c:'#A9BAC5',n:'Everything else'});
 var pc=function(v){return Math.round(v/tot*100)+'%'};

function trendBlock(r){
 var t=today(),end=r.to>t?t:r.to;
 if(r.from>end)return empty('No data for this period yet.');
 var b=S.accounts.reduce(function(s,a){return a.skip?s:s+a.start},0);
 S.tx.forEach(function(x){if(x.date<r.from)b+=eff(x)});
 var byDay={};S.tx.forEach(function(x){if(x.date>=r.from&&x.date<=end)byDay[x.date]=(byDay[x.date]||0)+eff(x)});
 var pts=[],d=r.from,mn=b,mx=b,start=b;
 while(d<=end){b+=byDay[d]||0;pts.push(b);if(b<mn)mn=b;if(b>mx)mx=b;d=dateAdd(d,1)}
 var n=pts.length,rng=mx-mn||1,X=function(i){return 10+(n>1?i/(n-1):0)*340},Y=function(v){return 108-(v-mn)/rng*92};
 var line=pts.map(function(v,i){return (i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)}).join(' ');
 var area=line+' L'+X(n-1).toFixed(1)+' 112 L'+X(0).toFixed(1)+' 112 Z';
 var svg='<svg class="chart" viewBox="0 0 360 140" width="360" height="140" role="img" aria-label="Balance trend from '+esc(money(start))+' to '+esc(money(b))+'"><path d="'+area+'" fill="var(--hl)"/><path d="'+line+'" fill="none" stroke="var(--acc)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="'+X(n-1).toFixed(1)+'" cy="'+Y(pts[n-1]).toFixed(1)+'" r="4.5" fill="var(--acc)" stroke="var(--card)" stroke-width="2"/><line x1="10" x2="350" y1="112.5" y2="112.5" stroke="var(--line)"/>'
  +'<text x="10" y="130" font-size="11" fill="var(--mut)" font-family="system-ui,sans-serif">'+esc(dShort(r.from))+'</text><text x="350" y="130" text-anchor="end" font-size="11" fill="var(--mut)" font-family="system-ui,sans-serif">'+esc(dShort(end))+'</text></svg>';
 var chg=b-start;
 return '<div class="split" style="margin:0 0 8px"><span>Start <b class="num">'+esc(money(start))+'</b></span><span>End <b class="num">'+esc(money(b))+'</b></span><span>Change <b class="num'+(chg>=0?' inc':'')+'">'+esc(money(chg,true))+'</b></span></div>'+svg
  +'<div class="hint" style="margin-top:4px">Low '+esc(money(mn))+' · High '+esc(money(mx))+'</div>';
}

function budgetStatus(spent,limit){
 var p=limit>0?spent/limit:0;
 if(p>=1)return {cls:'over',pill:'<span class="pill err">Over by '+esc(money(spent-limit))+'</span>',p:100};
 if(p>=.8)return {cls:'warn',pill:'<span class="pill warn">Almost at limit · '+esc(money(limit-spent))+' left</span>',p:p*100};
 return {cls:'',pill:'<span class="pill ok">'+esc(money(limit-spent))+' left</span>',p:p*100};
}
function tile(a){

 var big,lab;
 if(debt){big=b<0?money(-b):money(b);lab=b<0?'Owed':'In credit';
  if(a.limit>0)sb='Available '+money(Math.max(0,a.limit+b))}
 else{big=money(b);lab=''}
 if(a.skip)sb=(sb?sb+' · ':'')+'Not in total';
 return '<button class="tile" data-act="accSum" data-id="'+a.id+'" style="--c:'+a.color+'"><span class="tt">'+badgeHtml(a,24)+'<span>'+esc(ty.l)+'</span></span>'
  +'<span class="nm">'+esc(a.name)+'</span><span class="bl num">'+(lab?'<span class="small muted" style="font-weight:600">'+lab+' </span>':'')+esc(big)+'</span>'+(sb?'<span class="sb num">'+esc(sb)+'</span>':'')+'</button>';

function advOn(){var a=V.adv;return !!(a&&(a.min||a.max||a.acc||a.cat||a.tag))}
function filteredTx(){
 var q=V.q.trim().toLowerCase(),r=rangeFor(V.lmode),ad=V.adv||{};
 return sortTx(txIn(r.from,r.to)).filter(function(t){
  if(V.filter!=='all'&&t.type!==V.filter)return false;
  if(ad.min&&t.amt<ad.min)return false;if(ad.max&&t.amt>ad.max)return false;
  if(ad.acc&&t.acc!==ad.acc&&t.to!==ad.acc)return false;
  if(ad.cat&&!(ad.cat==='_none'?!t.cat:(t.cat===ad.cat||catTop(t.cat)===ad.cat)))return false;
  if(ad.tag&&(t.tags||[]).map(function(x){return x.toLowerCase()}).indexOf(ad.tag.toLowerCase())<0)return false;
  if(!q)return true;
  var a=accById(t.acc);
  return ((t.note||'')+' '+catName(t.cat)+' '+(t.trip&&tripById(t.trip)?tripById(t.trip).name:'')+' '+(a?a.name:'')+' '+(t.amt/100)+' '+(t.tags||[]).join(' ')).toLowerCase().indexOf(q)>-1;
 });
}
function logList(){
 var l=filteredTx();if(!l.length)return empty(V.q||V.filter!=='all'||advOn()?'Nothing matches.':'No transactions in this time frame.');
 var key=V.lmode+'|'+V.filter+'|'+V.q+'|'+JSON.stringify(V.adv||{})+'|'+V.cfrom+V.cto;if(V.limKey!==key){V.limKey=key;V.lim=120}
 var total=l.length,more=total>V.lim;if(more)l=l.slice(0,V.lim);

 l.forEach(function(t){
  if(t.date!==cur){flush();cur=t.date;net=0;buf=[]}
  if(t.type==='inc')net+=t.amt;else if(t.type==='exp')net-=t.amt;
  buf.push(txRow(t));
 });flush();
 if(more)h+='<button class="btn" data-act="logMore">Show more ('+(total-V.lim)+' left)</button>';
 return h;
}

function rolloverCarry(id,k){
 if(!S.settings.rollover||!(id in S.budgets))return 0;
 var first=null;S.tx.forEach(function(t){if(t.type==='exp'&&!t.ln&&(!first||t.date<first))first=t.date});
 if(!first)return 0;var m=first.slice(0,7),cur=k;if(m>=cur)return 0;
 var n=0;while(addMonth(m,1)<=cur&&n<36){m=addMonth(m,1);n++}
 var start=addMonth(cur,-Math.min(n,36)),carry=0,x=start;
 while(x<cur){var sp=(catSpendRoll(x)[id]||0);carry=Math.max(0,S.budgets[id]+carry-sp);x=addMonth(x,1)}
 return carry;
}
function budgetRows(k){

 Object.keys(S.budgets).forEach(function(id){var c=catById(id);if(!c)return;var cr=rolloverCarry(id,k);r.push({id:id,name:catName(id),color:catColor(id),base:S.budgets[id],carry:cr,limit:S.budgets[id]+cr,sp:sp[id]||0})});
 r.sort(function(a,b){return (b.sp/b.limit)-(a.sp/a.limit)});return r;
}

function goalStatus(g){
 var s=gs(g),nd=goalNeed(g);
 if(s>=g.target)return {k:'done',l:'Goal reached'};
 if(nd.days==null)return {k:'nodate',l:'No deadline'};
 if(nd.days<0)return {k:'late',l:'Past deadline'};
 var tot=Math.max(1,daysBetween(isoDate(new Date(g.created||Date.now())),g.deadline)),el=Math.max(0,tot-nd.days),exp=g.target*Math.min(1,el/tot);
 return s>=exp*0.95?{k:'on',l:'On track'}:{k:'behind',l:'Behind'};
}
function goalAvg(g){
 var pos=g.log.filter(function(e){return e.amt>0});if(!pos.length)return 0;
 var first=pos.reduce(function(a,e){return e.date<a?e.date:a},pos[0].date),mo=Math.max(1,daysBetween(first,today())/30.44);
 return Math.round(gs(g)/mo);
}

function initDrag(){
 var drag=null;
 document.addEventListener('pointerdown',function(e){
  var g=e.target.closest('.dgrip');if(!g)return;var el=g.closest('.dr');if(!el)return;e.preventDefault();
  var box=el.parentNode;drag={el:el,box:box,main:$('#main'),y:e.clientY,id:e.pointerId};el.classList.add('drag');
  try{g.setPointerCapture(e.pointerId)}catch(x){}
 });
 document.addEventListener('pointermove',function(e){
  if(!drag)return;e.preventDefault();var el=drag.el,r=el.getBoundingClientRect(),dy=e.clientY-drag.y;
  el.style.transform='translateY('+dy+'px)';
  var sibs=[].slice.call(drag.box.children).filter(function(x){return x!==el});
  for(var k=0;k<sibs.length;k++){var sr=sibs[k].getBoundingClientRect(),mid=sr.top+sr.height/2,mine=r.top+r.height/2;
   if(mine<mid&&sibs[k].compareDocumentPosition(el)&4){var before=el.getBoundingClientRect().top;drag.box.insertBefore(el,sibs[k]);var after=el.getBoundingClientRect().top;drag.y+=after-before+(0);el.style.transform='translateY('+(e.clientY-drag.y)+'px)';break}
   if(mine>mid&&sibs[k].compareDocumentPosition(el)&2){var b2=el.getBoundingClientRect().top;drag.box.insertBefore(el,sibs[k].nextSibling);var a2=el.getBoundingClientRect().top;drag.y+=a2-b2;el.style.transform='translateY('+(e.clientY-drag.y)+'px)';break}}
  var mr=drag.main.getBoundingClientRect();if(e.clientY<mr.top+70)drag.main.scrollTop-=14;else if(e.clientY>mr.bottom-110)drag.main.scrollTop+=14;
 },{passive:false});
 function end(){
  if(!drag)return;var el=drag.el;el.classList.remove('drag');el.style.transform='';
  var ids=[].slice.call(drag.box.children).map(function(x){return x.dataset.id}).filter(Boolean);drag=null;
  if(ids.join()!==dashList().join()){dashSet(ids);toast('Order saved')}
 }
 document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end);
}

function lockKey(k){
 if(k==='forgot'){ask('Erase all data on this device and start fresh? You can restore a backup afterwards. This cannot be undone.',function(){try{localStorage.removeItem(KEY);localStorage.removeItem(ACCKEY)}catch(e){}idbDel(PFX+'wall');location.reload()});return}

 var n=S.settings.pinLen||4;
 if(k==='ok'||lockBuf.length>=n&&k!=='x'){

   if(h===S.settings.pinHash){locked=false;lockFails=0;lockEl.hidden=true;$('#app').removeAttribute('inert')}

  var img=new Image(),u=URL.createObjectURL(file);
  img.onload=function(){var r=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);
   c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',q))};

 });
}

var pal=$('#pal'),palSel=0,palList=[],PAL_EXTRA=[];
function palItems(q){
 var out=[],n=function(t,g,run,sub){out.push({t:t,g:g,run:run,sub:sub||''})};
 MENU.forEach(function(g){g[1].forEach(function(it){n(it[3],'Go to',function(){nav(it[0],it[1])})})});
 n('Add expense','Actions',function(){txDlg(null,undefined,{type:'exp'})});
 n('Add income','Actions',function(){txDlg(null,undefined,{type:'inc'})});
 n('Transfer money','Actions',function(){txDlg(null,undefined,{type:'tr'})});
 n('New trip budget','Actions',function(){tripDlg()});
 n('New goal','Actions',function(){goalDlg()});
 n('New loan or utang','Actions',function(){loanEditDlg()});
 n('Add account','Actions',function(){accDlg()});
 n('Add credit card','Actions',function(){accDlg(null,'credit')});
 n('Customize dashboard','Actions',function(){V.dashEdit=true;nav('home')});
 n('Export transactions (CSV)','Actions',exportCsv);
 n('Back up data (JSON)','Actions',exportJson);
 n(S.settings.look==='glass'?'Switch to Classic look':'Switch to Glass look','Actions',function(){S.settings.look=S.settings.look==='glass'?'classic':'glass';save();applySettings();render(true)});
 PAL_EXTRA.forEach(function(x){n(x.t,x.g||'Actions',x.run,x.sub)});
 S.accounts.forEach(function(a){n(a.name,'Accounts',function(){accDlg(a.id)},typeOf(a).l)});
 S.trips.forEach(function(t){n(t.name,'Trips',function(){ACTS.openTrip({dataset:{id:t.id}})},t.status==='done'?'finished':'active')});
 S.goals.forEach(function(g){n(g.name,'Goals',function(){ACTS.openGoal({dataset:{id:g.id}})})});
 S.loans.forEach(function(l){n(l.who,'Loans',function(){loanDlg(l.id)},l.dir==='owe'?'I owe':'owed to me')});
 var tk=q.toLowerCase().split(/\s+/).filter(Boolean);
 var res=out.filter(function(o){var h=(o.t+' '+o.sub+' '+o.g).toLowerCase();return tk.every(function(k){return h.indexOf(k)>-1})});
 if(tk.length&&q.length>=2){
  var m=S.tx.filter(function(t){var a=accById(t.acc);return tk.every(function(k){return ((t.note||'')+' '+catName(t.cat)+' '+(a?a.name:'')+' '+(t.tags||[]).join(' ')).toLowerCase().indexOf(k)>-1})});
  sortTx(m).slice(0,6).forEach(function(t){res.push({t:(t.note||catName(t.cat))+' · '+money(t.type==='exp'?-t.amt:t.amt),g:'Transactions',sub:dShort(t.date),run:function(){txDlg(t.id)}})});
 }
 if(!tk.length)res=res.filter(function(o){return o.g==='Go to'||o.g==='Actions'}).slice(0,14);
 return res.slice(0,30);
}
function palRender(){
 var q=$('#pq',pal).value;palList=palItems(q);if(palSel>=palList.length)palSel=0;
 var h='',g='';
 if(!palList.length)h='<div class="pe">Nothing found.</div>';
 palList.forEach(function(o,i){if(o.g!==g){g=o.g;h+='<div class="pg">'+esc(g)+'</div>'}
  h+='<div class="po" role="option" id="po'+i+'" data-i="'+i+'" aria-selected="'+(i===palSel)+'"><span>'+esc(o.t)+'</span>'+(o.sub?'<small>'+esc(o.sub)+'</small>':'')+'</div>'});
 $('#pl',pal).innerHTML=h;
 var sel=$('#po'+palSel,pal);if(sel)sel.scrollIntoView({block:'nearest'});
}
function palOpen(){
 pal.innerHTML='<div class="pin">'+ic('search')+'<input id="pq" type="text" placeholder="Search or run action…" autocomplete="off" role="combobox" aria-expanded="true" aria-controls="pl"><kbd>Esc</kbd></div><div id="pl" role="listbox"></div>';
 palSel=0;if(!pal.open)pal.showModal();palRender();$('#pq',pal).focus();
}
function palRun(i){var o=palList[i];if(!o)return;pal.close();setTimeout(o.run,0)}
function initPal(){
 pal.addEventListener('input',function(e){if(e.target.id==='pq'){palSel=0;palRender()}});
 pal.addEventListener('keydown',function(e){
  if(e.key==='ArrowDown'){e.preventDefault();palSel=Math.min(palList.length-1,palSel+1);palRender()}
  else if(e.key==='ArrowUp'){e.preventDefault();palSel=Math.max(0,palSel-1);palRender()}
  else if(e.key==='Enter'){e.preventDefault();palRun(palSel)}
 });
 pal.addEventListener('click',function(e){var o=e.target.closest('.po');if(o)palRun(+o.dataset.i);else if(e.target===pal)pal.close()});
 document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();palOpen()}
  else if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&!document.querySelector('dialog[open]')){e.preventDefault();palOpen()}
 });
}

var tx0=null;
function initDrawer(){
 drawer.addEventListener('touchstart',function(e){tx0=e.touches[0].clientX},{passive:true});
 drawer.addEventListener('touchend',function(e){if(tx0!=null&&e.changedTouches[0].clientX-tx0<-60)drawer.close();tx0=null},{passive:true});
}

/* ================= trips ================= */
function tripById(id){return S.trips.filter(function(t){return t.id===id})[0]}
function tripSpent(id){var x=0;S.tx.forEach(function(t){if(t.type==='exp'&&t.trip===id)x+=t.amt});return x}
function tripTx(id){return sortTx(S.tx.filter(function(t){return t.trip===id&&t.type==='exp'}))}
function activeTrips(){return S.trips.filter(function(t){return t.status!=='done'}).sort(function(a,b){return (b.created||0)-(a.created||0)})}
function defaultTrip(){var a=activeTrips();return a[0]?a[0].id:''}
function daysBetween(a,b){return Math.round((Date.UTC(+b.slice(0,4),+b.slice(5,7)-1,+b.slice(8,10))-Date.UTC(+a.slice(0,4),+a.slice(5,7)-1,+a.slice(8,10)))/864e5)}
function tripOpts(sel){var l=activeTrips(),cur=sel&&tripById(sel);if(cur&&l.indexOf(cur)<0)l.push(cur);
 return '<option value="">No trip</option>'+l.map(function(t){return '<option value="'+t.id+'"'+(t.id===sel?' selected':'')+'>'+esc(t.name)+(t.status==='done'?' (finished)':'')+'</option>'}).join('')}
function tripRange(t){return dShort(t.start)+(t.end?' – '+dShort(t.end):'')}
function tripCard(t){
 var sp=tripSpent(t.id),st=budgetStatus(sp,t.budget),done=t.status==='done';
 return '<button class="row" data-act="openTrip" data-id="'+t.id+'" style="display:grid;gap:6px;padding:12px 0">'
  +'<span style="display:flex;gap:10px;align-items:center;min-width:0"><span class="cb" aria-hidden="true" style="width:30px;height:30px;background:color-mix(in srgb,var(--acc-ink) 18%,transparent);color:var(--acc-ink)">'+ic(done?'flag':'plane')+'</span><span class="grow t">'+esc(t.name)+'</span>'+(done?'<span class="pill">Finished</span>':'<span class="pill ok">Active</span>')+'</span>'
  +'<span class="small muted">'+esc(tripRange(t))+'</span>'
  +'<span class="bar '+st.cls+'" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+Math.round(st.p)+'" aria-label="'+esc(t.name)+' budget used"><i style="width:'+st.p.toFixed(1)+'%"></i></span>'
  +'<span style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span class="small muted num">Spent '+esc(money(sp))+' of '+esc(money(t.budget))+'</span>'+st.pill+'</span></button>';
}
function pTrips(){
 if(!S.trips.length)return '<section class="card">'+empty('Planning a trip or event? Give it a name and a budget. Expenses you add while it is active are tracked in one place, and still count everywhere else.','<button class="btn pri" data-act="newTrip">'+ic('plus')+'<span>New trip</span></button>')+'</section>';
 var act=activeTrips(),past=S.trips.filter(function(t){return t.status==='done'}).sort(function(a,b){return (b.end||'').localeCompare(a.end||'')});
 var h='<section class="card"><div class="sh">Active<span class="sp"><button class="btn ghost" data-act="newTrip">'+ic('plus')+'<span>New trip</span></button></span></div>'+(act.length?act.map(tripCard).join(''):'<div class="hint">No active trip. Start a new one to track its expenses.</div>')+'</section>';
 if(past.length)h+=acc('trips_done','Finished trips',String(past.length),past.map(tripCard).join(''),false);
 return h;
}
function pTrip(id){
 var t=tripById(id),sp=tripSpent(id),left=t.budget-sp,done=t.status==='done',txs=tripTx(id),td=today();
 var endEff=done?(t.end||td):td,days=Math.max(1,daysBetween(t.start,endEff)+1);
 var daysLeft=(!done&&t.end&&t.end>=td)?daysBetween(td,t.end)+1:null,st=budgetStatus(sp,t.budget);
 var h='<section class="card"><div class="sh">'+(done?(left>=0?'Finished · under budget by':'Finished · over budget by'):(left>=0?'Left to spend':'Over budget by'))+'<span class="sp muted" style="font-weight:400">'+esc(tripRange(t))+'</span></div>'
  +'<div class="big num"'+(left<0?' style="color:var(--err)"':'')+'>'+esc(money(Math.abs(left)))+'</div>'
  +'<div class="split"><span>Budget <b class="num">'+esc(money(t.budget))+'</b></span><span>Spent <b class="num">'+esc(money(sp))+'</b></span></div>'
  +'<div class="bar '+st.cls+'" style="margin-top:12px" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+Math.round(st.p)+'" aria-label="Trip budget used"><i style="width:'+st.p.toFixed(1)+'%"></i></div><div style="margin-top:8px">'+st.pill+'</div>'
  +'<div class="split"><span>Per day <b class="num">'+esc(money(Math.round(sp/days)))+'</b></span><span>'+days+' day'+(days===1?'':'s')+'</span>'+(daysLeft!=null&&left>0?'<span>Left per day <b class="num">'+esc(money(Math.floor(left/daysLeft)))+'</b> ('+daysLeft+' to go)</span>':'')+'</div>'
  +(t.note?'<div class="hint" style="margin-top:8px">'+esc(t.note)+'</div>':'')+'</section>';
 h+='<div class="chips">'+(done?'<button class="btn pri" data-act="reopenTrip" data-id="'+id+'">Reopen trip</button>':'<button class="btn pri" data-act="addTripTx" data-id="'+id+'">'+ic('plus')+'<span>Add expense</span></button><button class="btn" data-act="finishTrip" data-id="'+id+'">Finish trip</button>')+'<button class="btn ghost" data-act="editTrip" data-id="'+id+'">Edit</button></div>';
 if(!done)h+='<div class="hint">New expenses are added to this trip by default. They still count in your accounts, Log and Reports.</div>';
 var m={};txs.forEach(function(x){var c=x.cat||'_none';m[c]=(m[c]||0)+x.amt});
 h+='<section class="card"><div class="sh">Expense structure</div>'+spendBlock(m,'Trip spending by category',txs)+'</section>';
 var g='',cur='',tot=0,buf=[];
 function fl(){if(cur)g+='<div class="day"><span>'+esc(dayLabel(cur))+'</span><span class="num">'+esc(money(-tot))+'</span></div>'+buf.join('')}
 txs.forEach(function(x){if(x.date!==cur){fl();cur=x.date;tot=0;buf=[]}tot+=x.amt;buf.push(txRow(x))});fl();
 h+='<section class="card"><div class="sh">Expenses<span class="sp muted" style="font-weight:400">'+txs.length+'</span></div>'+(txs.length?g:empty('No expenses yet.'))+'</section>';
 return h;
}
function pBudgets(){
 if(V.trip&&tripById(V.trip))return pTrip(V.trip);
 var n=activeTrips().length;
 return '<div class="chips" role="group" aria-label="Budget type"><button class="chip" data-act="bmode" data-v="month" aria-pressed="'+(V.bmode==='month')+'">Monthly</button><button class="chip" data-act="bmode" data-v="trips" aria-pressed="'+(V.bmode==='trips')+'">Trips'+(n?' ('+n+' active)':'')+'</button></div>'
  +(V.bmode==='trips'?pTrips():pBudgetsMonthly());
}
function tripDlg(id){
 var t=id?tripById(id):null;
 openDlg('<form class="dform" novalidate><h2 id="dlg-t">'+(t?'Edit trip':'New trip')+'</h2>'
  +'<label class="field"><span>Name</span><input type="text" name="name" maxlength="40" value="'+esc(t?t.name:'')+'" placeholder="e.g. Catanduanes trip" autocomplete="off"></label>'
  +'<label class="field"><span>Trip budget ('+esc(S.settings.cur)+')</span><input class="amount" name="bud" inputmode="decimal" placeholder="0.00" value="'+(t?(t.budget/100).toFixed(2):'')+'"></label>'
  +'<div class="daterow"><label class="field"><span>Start</span><input type="date" name="start" value="'+(t?t.start:today())+'"></label><label class="field"><span>End (optional)</span><input type="date" name="end" value="'+(t&&t.end?t.end:'')+'"></label></div>'
  +'<label class="field"><span>Note (optional)</span><input type="text" name="note" maxlength="120" value="'+esc(t?t.note||'':'')+'" autocomplete="off"></label>'
  +'<div class="hint">While a trip is active, new expenses are added to it by default and also count everywhere else. Finish the trip when you are done.</div>'
  +'<div class="err" role="alert" id="derr"></div>'
  +'<div class="actions"><button class="btn pri grow" type="submit">Save</button><button class="btn" type="button" data-close>Cancel</button>'+(t?'<button class="btn danger icon" type="button" data-act="delTrip" data-id="'+t.id+'" aria-label="Delete trip">'+ic('x')+'</button>':'')+'</div></form>',
 function(f){
  var n=f.name.value.trim(),b=parseAmt(f.bud.value),e=f.end.value;
  if(!n){$('#derr').textContent='Give the trip a name.';return}
  if(!(b>0)){$('#derr').textContent='Enter a budget greater than zero.';return}
  if(!f.start.value){$('#derr').textContent='Pick a start date.';return}
  if(e&&e<f.start.value){$('#derr').textContent='End date is before the start.';return}
  var o={name:n,budget:b,start:f.start.value,end:e||'',note:f.note.value.trim()};
  if(t)Object.assign(t,o);else{o.id=uid();o.status='active';o.created=Date.now();S.trips.push(o);t=o;V.tab='budgets';V.bmode='trips';V.trip=o.id}
  save();dlg.close();render();toast('Saved');
 });
 $('form',dlg).name.focus();
}

/* ================= goals ================= */
function goalById(id){return S.goals.filter(function(g){return g.id===id})[0]}
function gs(g){return g.log.reduce(function(s,e){return s+e.amt},0)}
function goalNeed(g){var s=gs(g),left=Math.max(0,g.target-s),days=g.deadline?daysBetween(today(),g.deadline):null,o={left:left,days:days};

 return h;

/* ================= credits: cards + loans / utang ================= */
function loanById(id){return S.loans.filter(function(l){return l.id===id})[0]}
function loanPaid(l){return l.pay.reduce(function(s,p){return s+p.amt},0)}
function loanLeft(l){return Math.max(0,l.amt-loanPaid(l))}
function dueInfo(a){
 if(!a.due)return null;var t=today(),y=+t.slice(0,4),m=+t.slice(5,7)-1;
 function mk(yy,mm){var last=new Date(yy,mm+1,0).getDate();return isoDate(new Date(yy,mm,Math.min(a.due,last)))}
 var d=mk(y,m);if(d<t)d=mk(m===11?y+1:y,(m+1)%12);
 return {date:d,days:daysBetween(t,d)};
}
function duePill(days,date,label){
 if(days<0)return '<span class="pill err">'+label+' overdue by '+(-days)+' day'+(days===-1?'':'s')+'</span>';
 if(days===0)return '<span class="pill warn">'+label+' today</span>';
 if(days<=7)return '<span class="pill warn">'+label+' in '+days+' day'+(days===1?'':'s')+'</span>';
 return '<span class="pill">'+label+' '+esc(dShort(date))+'</span>';
}
function creditCard(a){
 var b=bal(a.id),owed=b<0?-b:0,lim=a.limit,util=lim>0?Math.min(100,owed/lim*100):0,due=dueInfo(a),cls=util>=70?'over':util>=30?'warn':'';
 var use=lim>0?(util>=70?'<span class="pill err">High use · '+Math.round(util)+'%</span>':util>=30?'<span class="pill warn">Moderate use · '+Math.round(util)+'%</span>':'<span class="pill ok">Low use · '+Math.round(util)+'%</span>'):'';
 return '<section class="card" style="display:grid;gap:8px"><div style="display:flex;gap:10px;align-items:center;min-width:0">'+badgeHtml(a,32)+'<div class="grow" style="flex:1;min-width:0"><div class="t" style="font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(a.name)+'</div><div class="small muted">'+esc(typeOf(a).l)+'</div></div></div>'
  +'<div class="big num" style="font-size:28px">'+esc(money(owed))+' <span class="small muted" style="font-weight:600">owed</span></div>'
  +(lim>0?'<div class="bar '+cls+'" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+Math.round(util)+'" aria-label="'+esc(a.name)+' limit used"><i style="width:'+util.toFixed(1)+'%"></i></div><div class="split" style="margin-top:0"><span>Limit <b class="num">'+esc(money(lim))+'</b></span><span>Available <b class="num">'+esc(money(Math.max(0,lim-owed)))+'</b></span></div>':'<div class="hint">Add a credit limit to see how much you are using.</div>')
  +'<div class="chips">'+use+(due&&owed>0?duePill(due.days,due.date,'Due'):'')+'</div>'
  +'<div class="chips"><button class="btn pri" data-act="payCard" data-id="'+a.id+'">Record payment</button><button class="btn ghost" data-act="editAcc" data-id="'+a.id+'">Edit</button></div></section>';
}
var LENDERS=[{n:'SSS loan',s:'SSS',c:'#1B4F9C'},{n:'Pag-IBIG loan',s:'PI',c:'#D81E2B'},{n:'Bank loan',i:'bank',c:'#718A9B'}];
function lenderBadge(who,px){
 var w=(who||'').trim().toLowerCase();if(!w)return '';
 var b=BRANDS.filter(function(x){return x.n.toLowerCase()===w})[0];if(b)return badgeHtml({brand:b.k},px);
 var m=LENDERS.filter(function(x){return x.n.toLowerCase()===w||(x.s&&w.indexOf(x.s.toLowerCase())===0)})[0];
 if(!m)return '';
 if(m.i)return '<span class="badge gen" aria-hidden="true" style="width:'+px+'px;height:'+px+'px">'+ic(m.i)+'</span>';
 var fg=lum(m.c)>.62?'#303D48':'#fff';
 return '<span class="badge" aria-hidden="true" style="width:'+px+'px;height:'+px+'px;background:'+m.c+';color:'+fg+';font-size:'+bFit(m.s,px)+'px" data-n="'+Math.min(m.s.length,5)+'">'+esc(m.s)+'</span>';
}
function loanPay(l){var left=loanLeft(l);return l.inst&&l.inst.amt>0?Math.min(left,l.inst.amt):left}
function loanLeftN(l){return l.inst&&l.inst.amt>0?Math.ceil(loanLeft(l)/l.inst.amt):0}
function loanOcc(l,first,last){var o=[],d=l.due,left=loanLeft(l),n=0;if(!left||!d)return o;
 if(!(l.inst&&l.inst.amt>0)){if(d>=first&&d<=last)o.push({d:d,amt:left});return o}
 var rem=left;while(d<=last&&rem>0&&n++<60){var a=Math.min(rem,l.inst.amt);if(d>=first)o.push({d:d,amt:a});rem-=a;d=advDate(d,l.inst.freq,l.inst.day)}return o}
function loanCard(l){
 var left=loanLeft(l),paid=loanPaid(l),p=l.amt>0?Math.min(100,paid/l.amt*100):0,pill='';
 if(left===0)pill='<span class="pill ok">Settled</span>';
 else if(l.due){var d=daysBetween(today(),l.due);pill=duePill(d,l.due,'Due')}
 var lb=lenderBadge(l.who,30);
 return '<button class="row" data-act="openLoan" data-id="'+l.id+'" style="display:grid;gap:6px;padding:12px 0"><span style="display:flex;gap:10px;align-items:center;min-width:0">'+(lb||'<span class="cb" aria-hidden="true" style="width:30px;height:30px;background:color-mix(in srgb,'+(l.dir==='owe'?'var(--warnacc)':'var(--ok)')+' 22%,transparent);color:'+(l.dir==='owe'?'var(--warnacc)':'var(--ok-ink)')+'">'+ic(l.dir==='owe'?'up':'down')+'</span>')+'<span class="grow t">'+esc(l.who)+'</span><b class="num">'+esc(money(left))+'</b></span>'
  +'<span class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+Math.round(p)+'" aria-label="'+esc(l.who)+' repaid"><i style="width:'+p.toFixed(1)+'%"></i></span>'
  +'<span style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span class="small muted num">Paid '+esc(money(paid))+' of '+esc(money(l.amt))+(l.inst&&l.inst.amt>0&&left>0?' · '+esc(money(l.inst.amt))+' '+esc(({weekly:'weekly',biweekly:'every 2 wks',monthly:'monthly'})[l.inst.freq]||'')+(loanLeftN(l)?' · '+loanLeftN(l)+' left':''):'')+'</span>'+pill+'</span></button>';
}
function creditTotals(){
 var cards=S.accounts.filter(function(a){return TYPES[a.type].debt}),oc=0,io=0,om=0;

function loanDlg(id){

 var hist=l.pay.slice().sort(function(a,b){return a.date<b.date?1:-1}).map(function(p){return '<div class="row" style="min-height:44px"><span class="grow"><div class="t num">'+esc(money(p.amt))+(p.int?' + '+esc(money(p.int))+' interest':'')+'</div><div class="s">'+esc(dayLabel(p.date))+(p.tx?' · in your accounts':'')+'</div></span><button type="button" class="btn ghost icon" data-act="delPay" data-id="'+l.id+'" data-p="'+p.id+'" aria-label="Delete payment">'+ic('x')+'</button></div>'}).join('');

function dRange(){
 var d=S.settings.drange||{},m=d.mode||'month',o=Math.min(0,d.off||0),t=today(),f,e,l,ps=null,k;
 if(m==='week'){var k0=(new Date().getDay()+6)%7;f=dateAdd(t,-k0+o*7);e=dateAdd(f,6);l=o===0?'This week':fullDate(f)+' – '+fullDate(e);ps=dateAdd(f,-7)}
 else if(m==='month'){k=addMonth(thisMonth(),o);f=k+'-01';e=lastDay(k);l=monthLabel(k);ps=addMonth(k,-1)+'-01'}
 else if(m==='year'){var y=+t.slice(0,4)+o;f=y+'-01-01';e=y+'-12-31';l=String(y);ps=(y-1)+'-01-01'}
 else if(m==='3m'){f=addMonth(thisMonth(),-2)+'-01';e=lastDay(thisMonth());l='Last 3 months'}
 else if(m==='all'){f='0000-01-01';e='9999-12-31';l='All time'}
 else{m='custom';f=d.from||dateAdd(t,-29);e=d.to||t;if(f>e){var x=f;f=e;e=x}l=fullDate(f)+(f===e?'':' – '+fullDate(e))}
 var ee=e<t?e:t;if(ee<f)ee=f;
 var len=m==='all'?0:daysBetween(f,ee)+1,pf=null,pe=null;
 if(ps){pf=ps;pe=dateAdd(ps,len-1)}else if(m==='3m'||m==='custom'){pf=dateAdd(f,-len);pe=dateAdd(f,-1)}
 return {mode:m,off:o,from:f,to:e,eff:ee,label:l,pf:pf,pe:pe,days:len,cur:o===0&&(m==='week'||m==='month'||m==='year')}
}

 subFlag:function(el){var r=S.recurring.filter(function(x){return x.id===el.dataset.id})[0];if(r){r.review=!r.review;save();render(true)}},
 subAdd:function(el){var x=subDetect().filter(function(d){return d.k===el.dataset.k})[0];if(!x)return;S.recurring.push({id:uid(),type:'exp',amt:x.amt,acc:x.acc,to:null,cat:x.cat,freq:x.freq,day:+x.last.slice(8,10),next:advDate(x.last,x.freq,+x.last.slice(8,10)),note:x.note,tags:[]});save();render(true);toast('Added to repeats')},
 printPg:function(){try{window.print()}catch(e){toast('Printing is not available here')}},
 shareRev:function(){var m=$('#main'),t=(V.sub==='year'?'Year in review ':'Monthly review ')+(V.sub==='year'?(V.year||today().slice(0,4)):monthLabel(V.rmonth||today().slice(0,7)));
  var x=m?m.innerText.replace(/\n{2,}/g,'\n').split('\n').filter(function(l){return !/^(Save as PDF|Share summary|Previous|Next)/.test(l)}).join('\n').slice(0,1800):'';
  if(navigator.share){navigator.share({title:'DiGe Budget · '+t,text:x}).catch(function(){})}
  else if(navigator.clipboard){navigator.clipboard.writeText(x).then(function(){toast('Summary copied')}).catch(function(){toast('Could not copy')})}
  else toast('Sharing is not available here')},
 logMore:function(){V.lim+=120;$('#loglist').innerHTML=logList()},
 advDlg:function(){advDlg()},
 advClear:function(){V.adv=null;V.filter='all';if(dlg.open)dlg.close();render(true)},
 svf:function(el){var x=svfList().filter(function(y){return y.id===el.dataset.id})[0];if(!x)return;V.filter=x.f.type||'all';V.adv=Object.assign({},x.f.adv);if(dlg.open)dlg.close();render(true);toast('Filter: '+x.name)},

 lender:function(el){var i=dlg.querySelector('input[name=who]');if(i){i.value=el.dataset.v;var d=dlg.querySelector('input[name=dir][value=owe]');if(d)d.checked=true;i.dispatchEvent(new Event('input',{bubbles:true}))}},
 accChip:function(el){var f=el.closest('form');if(!f)return;var sel=f[el.dataset.s];sel.value=el.dataset.v;sel.dispatchEvent(new Event('change',{bubbles:true}));accSync(f)},
 dedAdd:function(el){var w=el.closest('details').querySelector('#dedrows'),d=document.createElement('div');d.innerHTML=dedRow('',0);w.appendChild(d.firstChild);var i=w.lastChild.querySelector('.dn');if(i)i.focus()},
 dedDel:function(el){var f=el.closest('form'),r=el.closest('.dedrow');if(r)r.remove();if(f)dedCalc(f)},
 avPick:function(el){var f=el.closest('form');f.av.value=el.dataset.i;f.img.value='';avRefresh(f)},
 avClear:function(el){var f=el.closest('form');f.av.value='';f.img.value='';avRefresh(f)},
 avUpload:function(el){var f=el.closest('form'),i=f.avfile;i.onchange=function(){var fl=i.files&&i.files[0];if(!fl)return;shrink(fl,160,.82).then(function(u){f.img.value=u;f.av.value='';avRefresh(f)}).catch(function(){toast('That picture could not be read')})};i.click()},
 lockToggle:function(){if(S.settings.pinHash)rmPinDlg();else pinDlg()},
 newRec:function(){recDlg()},editRec:function(el){recDlg(el.dataset.id)},
 delRec:function(el){S.recurring=S.recurring.filter(function(r){return r.id!==el.dataset.id});save();dlg.close();render(true);toast('Deleted')},
 delTpl:function(el){S.templates=S.templates.filter(function(r){return r.id!==el.dataset.id});save();render(true)},
 useTpl:function(el){var x=S.templates.filter(function(q){return q.id===el.dataset.id})[0],f=$('form',dlg);if(!x||!f)return;
  var rd=f.querySelector('input[name=type][value="'+x.type+'"]');if(rd){rd.checked=true;rd.dispatchEvent(new Event('change',{bubbles:true}))}
  f.amt.value=(x.amt/100).toFixed(2);if(accById(x.acc))f.acc.value=x.acc;if(x.cat&&f.cat.querySelector('option[value="'+x.cat+'"]')){f.cat.value=x.cat;catLbl(f)}f.note.value=x.note||''},
 saveTpl:function(){var f=$('form',dlg),amt=parseAmt(f.amt.value),ty=f.type.value;
  if(!(amt>0)){$('#derr').textContent='Enter an amount first, then save it as a template.';return}
  var nm=(f.note.value.trim()||catName(f.cat.value)||'Template');
  S.templates.push({id:uid(),name:nm.slice(0,24),type:ty,amt:amt,acc:f.acc.value,cat:ty==='tr'?null:(f.cat.value||null),note:f.note.value.trim()});save();toast('Template saved: '+nm)},
 viewRc:function(el){idbGet('rc_'+el.dataset.id).then(function(u){if(!u){toast('Receipt not found on this device');return}
  openDlg('<div class="dform"><h2 id="dlg-t">Receipt</h2><img src="'+u+'" alt="Receipt photo" style="max-width:100%;max-height:60dvh;object-fit:contain;border-radius:8px"><div class="actions"><button class="btn" type="button" data-close>Close</button><button class="btn danger" type="button" data-act="rmRc" data-id="'+el.dataset.id+'">Remove receipt</button></div></div>')})},
 rmRc:function(el){var x=S.tx.filter(function(q){return q.id===el.dataset.id})[0];if(x)delete x.rc;idbDel('rc_'+el.dataset.id);save();dlg.close();render(true)},
 quickTx:function(el){txDlg(null,undefined,{type:el.dataset.type})},
 look:function(el){S.settings.look=el.dataset.v;save();applySettings();render(true)},
 wall:function(el){S.settings.wall=el.dataset.v;save();applySettings();render(true)},
 wallUp:function(){$('#wallfile').click()},
 wallRm:function(){idbDel(PFX+'wall');S.settings.wall='dusk';save();applySettings();render(true)},
 bmode:function(el){V.bmode=el.dataset.v;V.trip=null;render(true)},
 openTrip:function(el){V.tab='budgets';V.bmode='trips';V.trip=el.dataset.id;render();$('#main').scrollTop=0},
 newTrip:function(){tripDlg()},editTrip:function(el){tripDlg(el.dataset.id)},
 finishTrip:function(el){var t=tripById(el.dataset.id);ask('Finish "'+t.name+'"? New expenses will no longer be added to it automatically. You can reopen it later.','Finish trip').then(function(ok){if(!ok)return;var x=tripTx(t.id),last=x.length?x[0].date:today();t.status='done';t.end=last>t.start?last:t.start;save();render(true);toast('Trip finished')})},
 reopenTrip:function(el){var t=tripById(el.dataset.id);t.status='active';if(t.end&&t.end<today())t.end='';save();render(true);toast('Trip reopened')},
 delTrip:function(el){var id=el.dataset.id;ask('Delete this trip? Its expenses stay in your records but are no longer grouped.').then(function(ok){if(!ok)return;S.trips=S.trips.filter(function(t){return t.id!==id});S.tx.forEach(function(t){if(t.trip===id)t.trip=null});V.trip=null;save();dlg.close();render();toast('Trip deleted')})},
 addTripTx:function(el){txDlg(null,el.dataset.id)},
 openGoal:function(el){V.tab='more';V.sub='goals';V.goal=el.dataset.id;render();$('#main').scrollTop=0},
 newGoal:function(){goalDlg()},editGoal:function(el){goalDlg(el.dataset.id)},
 delGoal:function(el){var id=el.dataset.id;ask('Delete this goal and its history?').then(function(ok){if(!ok)return;S.goals=S.goals.filter(function(g){return g.id!==id});V.goal=null;save();dlg.close();render();toast('Goal deleted')})},
 addMoney:function(el){contribDlg(el.dataset.id,null,+el.dataset.sign)},
 editContrib:function(el){contribDlg(el.dataset.id,el.dataset.e)},
 delContrib:function(el){var g=goalById(el.dataset.id),rest=g.log.filter(function(x){return x.id!==el.dataset.e}),sum=rest.reduce(function(a,x){return a+x.amt},0);
  if(sum<0){$('#derr').textContent='Removing this would leave a negative balance.';return}var gone=g.log.filter(function(x){return x.id===el.dataset.e})[0];if(gone&&gone.tx)S.tx=S.tx.filter(function(t){return t.id!==gone.tx});g.log=rest;save();dlg.close();render(true);toast('Entry deleted')},
 openLoan:function(el){loanDlg(el.dataset.id)},newLoan:function(){loanEditDlg()},editLoan:function(el){loanEditDlg(el.dataset.id)},
 delLoan:function(el){var id=el.dataset.id;ask('Delete this loan and its payment history? Payments already recorded in your accounts stay.').then(function(ok){if(!ok)return;S.loans=S.loans.filter(function(l){return l.id!==id});save();dlg.close();render(true);toast('Loan deleted')})},
 delPay:function(el){var l=loanById(el.dataset.id),p=l.pay.filter(function(x){return x.id===el.dataset.p})[0];if(p)S.tx=S.tx.filter(function(t){return t.id!==p.tx&&t.id!==p.itx});l.pay=l.pay.filter(function(x){return x.id!==el.dataset.p});save();render(true);loanDlg(l.id)},
 payCard:function(el){txDlg(null,undefined,{type:'tr',to:el.dataset.id})},
 addCard:function(){accDlg(null,'credit')},
 dashEdit:function(){V.dashEdit=true;render();$('#main').scrollTop=0},
 dashDone:function(){V.dashEdit=false;render();$('#main').scrollTop=0},
 dashUp:function(el){var d=dashList(),i=d.indexOf(el.dataset.id);if(i>0){d.splice(i-1,0,d.splice(i,1)[0]);dashSet(d)}},
 dashDown:function(el){var d=dashList(),i=d.indexOf(el.dataset.id);if(i>-1&&i<d.length-1){d.splice(i+1,0,d.splice(i,1)[0]);dashSet(d)}},
 dashRemove:function(el){dashSet(dashList().filter(function(x){return x!==el.dataset.id}))},
 dashAdd:function(el){var d=dashList();d.push(el.dataset.id);dashSet(d)},
 dashReset:function(){dashSet(DASH_DEFAULT.slice())},
 undo:function(){var t=$('#toast');if(t._undo)t._undo();t.hidden=true;t._undo=null}
};
document.addEventListener('click',function(e){
 var c=e.target.closest('[data-close]');if(c){var d=c.closest('dialog');if(d)d.close();return}
 var el=e.target.closest('[data-act]');if(!el)return;
 var fn=ACTS[el.dataset.act];if(fn)fn(el);
});
document.addEventListener('input',function(e){
 if(e.target.id==='q'){V.q=e.target.value;$('#loglist').innerHTML=logList()}
 if(e.target.id==='cur'){S.settings.cur=e.target.value.trim()||'₱';save()}
});
document.addEventListener('change',function(e){
 if(e.target.id==='cur')render(true);
 if(e.target.id==='drfrom'||e.target.id==='drto'){var dv=e.target.value;if(!dv)return;var dd=S.settings.drange=S.settings.drange||{mode:'custom'};if(e.target.id==='drfrom')dd.from=dv;else dd.to=dv;save();render(true);return}
 if(e.target.id==='cfrom'||e.target.id==='cto'){var v=e.target.value;if(!v)return;if(e.target.id==='cfrom')V.cfrom=v;else V.cto=v;render(true)}
});

$('#wallfile').addEventListener('change',function(e){var f=e.target.files[0];e.target.value='';if(!f)return;
 shrink(f,1600,.72).then(function(u){return idbPut(PFX+'wall',u)}).then(function(){S.settings.wall='photo';S.settings.look='glass';save();applySettings();render(true);toast('Background set')}).catch(function(){toast('That image could not be used')})});

PAL_EXTRA.push({t:'Glass tone: light',g:'Actions',run:function(){ACTS.tone({dataset:{v:'light'}})}});
PAL_EXTRA.push({t:'Glass tone: dark',g:'Actions',run:function(){ACTS.tone({dataset:{v:'dark'}})}});

$('#logofile').addEventListener('change',function(e){var f=e.target.files[0];e.target.value='';if(!f||!V.logoFor)return;logoFromFile(f).then(function(u){LOGOS[V.logoFor]=u;return logoSave()}).then(function(){render(true);toast('Logo saved')}).catch(function(){toast('That image could not be used')})});
$('#logosfile').addEventListener('change',function(e){var fs=[].slice.call(e.target.files);e.target.value='';var n=0,miss=[];
 Promise.all(fs.map(function(f){var k=norm(f.name),best=null;BRANDS.forEach(function(b){[b.k,norm(b.n)].forEach(function(c){if(k.indexOf(c)>-1&&(!best||c.length>best.l))best={b:b,l:c.length}})});
  if(!best){miss.push(f.name);return}return logoFromFile(f).then(function(u){LOGOS[best.b.k]=u;n++}).catch(function(){miss.push(f.name)})})).then(logoSave).then(function(){render(true);toast(n+' logos added'+(miss.length?', '+miss.length+' not matched':''))})});
$('#shotfile').addEventListener('change',function(e){var f=e.target.files[0];e.target.value='';if(!f)return;var r=new FileReader();r.onload=function(){cutDlg(String(r.result))};r.readAsDataURL(f)});
idbGet(PFX+'logos').then(function(v){if(v&&typeof v==='object'){LOGOS=v;render(true)}});
try{matchMedia('(prefers-color-scheme:dark)').addEventListener('change',function(){if(S.settings.gtone==='auto')applySettings()})}catch(e){}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});S=load();runRecurring();initDrawer();initPal();initLock();initDrag();applySettings();render();banner();setupMaybe();runShortcut();
try{if(matchMedia){matchMedia('(prefers-color-scheme:dark)').addEventListener('change',applySettings)}}catch(e){}
window.__dgb={get:function(){return S},V:V};
})();
